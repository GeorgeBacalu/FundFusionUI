<div class="flex flex-column">
  <div class="flex align-items-center justify-content-between py-2 px-3 shadow-2 bg-green-200">
    <div class="flex align-items-center gap-2 cursor-pointer" (click)="navigateToHome()">
      <img src="assets/images/logo.svg" alt="FundFusion Logo" width="48" height="48" />
      <span class="text-2xl text-green-700 font-bold">Fund Fusion</span>
    </div>
    <div>
      <p-avatar [image]="avatarUrl" icon="pi pi-user" shape="circle" size="xlarge" styleClass="cursor-pointer" (click)="menu.toggle($event)"></p-avatar>
      <p-menu #menu [popup]="true" [model]="menuItems"></p-menu>
    </div>
  </div>
  <div class="flex-1 overflow-auto">
    <router-outlet></router-outlet>
  </div>
</div>
