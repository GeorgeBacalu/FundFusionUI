<div class="flex justify-content-center align-items-center h-screen">
  <form [formGroup]="forgotPasswordForm" (ngSubmit)="sendResetLink()">
    <p-card header="Forgot Password" class="w-full">
      <div class="field">
        <label for="email">Email <span class="text-red-500">*</span></label>
        <input type="text" id="email" formControlName="email" pInputText class="w-full" placeholder="Enter your email" autocomplete="email" />
        <small *ngIf="email.errors?.['required'] && (email.dirty || email.touched)" class="block text-red-500">Email is required</small>
        <small *ngIf="email.errors?.['email'] && (email.dirty || email.touched)" class="block text-red-500">Invalid email address</small>
      </div>
      <p-button type="submit" label="Send Reset Link" styleClass="w-full" [disabled]="forgotPasswordForm.invalid" />
      <div class="mt-2">Remembered your password? <a routerLink="/login" class="text-primary no-underline">Login</a></div>
    </p-card>
  </form>
</div>
