<div class="flex justify-content-center align-items-center h-screen">
  <form [formGroup]="forgotPasswordForm" (ngSubmit)="sendResetLink()">
    <p-card header="Forgot Password" class="w-full sm:w-8 md:w-6 lg:w-4 xl:w-3">
      <div class="field">
        <label for="email">Email</label>
        <input type="text" id="email" formControlName="email" pInputText class="w-full" placeholder="Enter your email" />
        <small class="block text-red-500" *ngIf="email.invalid && (email.dirty || email.touched)">
          <div *ngIf="email.errors?.['required']">Email is required</div>
          <div *ngIf="email.errors?.['email']">Invalid email address</div>
        </small>
      </div>
      <p-button type="submit" label="Send Reset Link" styleClass="w-full" [disabled]="forgotPasswordForm.invalid"></p-button>
      <div class="mt-2">Remembered your password? <a routerLink="/login" class="text-primary no-underline">Login</a></div>
    </p-card>
  </form>
</div>
