<div class="flex justify-content-center align-items-center h-screen">
  <form [formGroup]="registerForm" (ngSubmit)="register()">
    <p-card header="Register" class="w-full sm:w-8 md:w-6 lg:w-4 xl:w-3">
      <div class="field">
        <label for="name">Name <span class="text-red-500">*</span></label>
        <input type="text" id="name" pInputText formControlName="name" class="w-full" placeholder="Enter your name" autocomplete="name" />
        <small class="block text-red-500" *ngIf="name.invalid && (name.dirty || name.touched)">
          <div *ngIf="name.errors?.['required']">Name is required</div>
        </small>
      </div>
      <div class="field">
        <label for="email">Email <span class="text-red-500">*</span></label>
        <input type="email" id="email" pInputText formControlName="email" class="w-full" placeholder="Enter your email" autocomplete="email" />
        <small class="block text-red-500" *ngIf="email.invalid && (email.dirty || email.touched)">
          <div *ngIf="email.errors?.['required']">Email is required</div>
          <div *ngIf="email.errors?.['email']">Invalid email address</div>
        </small>
      </div>
      <div class="field">
        <label for="password">Password <span class="text-red-500">*</span></label>
        <p-password inputId="password" formControlName="password" inputStyleClass="w-full" styleClass="w-full" placeholder="Enter your password" [feedback]="false" [toggleMask]="true" />
        <small class="block text-red-500" *ngIf="password.invalid && (password.dirty || password.touched)">
          <div *ngIf="password.errors?.['required']">Password is required</div>
          <div *ngIf="password.errors?.['pattern']">Invalid password</div>
        </small>
      </div>
      <div class="field">
        <label for="confirmedPassword">Confirmed password <span class="text-red-500">*</span></label>
        <p-password inputId="confirmedPassword" formControlName="confirmedPassword" inputStyleClass="w-full" styleClass="w-full" placeholder="Confirm your password" [feedback]="false" [toggleMask]="true" />
        <small class="block text-red-500" *ngIf="confirmedPassword.invalid && (confirmedPassword.dirty || confirmedPassword.touched)">
          <div *ngIf="confirmedPassword.errors?.['required']">Confirmed password is required</div>
        </small>
        <small class="block text-red-500" *ngIf="registerForm.errors?.['passwordMismatch'] && confirmedPassword.valid && password.valid">Passwords don't match</small>
      </div>
      <div class="field">
        <label for="phone">Phone <span class="text-red-500">*</span></label>
        <div class="flex gap-2 w-full">
          <p-dropdown [options]="countriesPhoneData" optionLabel="label" formControlName="countryPhoneData" [filter]="true" class="w-6" placeholder="Country (Prefix)" (onChange)="onCountryChange()"></p-dropdown>
          <ng-container *ngIf="mask"><p-inputMask [mask]="mask" [autoClear]="false" formControlName="phone" class="w-7" placeholder="(999) 999-9999"></p-inputMask></ng-container>
        </div>
        <small class="block text-red-500" *ngIf="phone.invalid && (phone.dirty || phone.touched)">
          <div *ngIf="phone.errors?.['required']">Phone is required</div>
        </small>
        <small class="block text-red-500" *ngIf="registerForm.errors?.['invalidPhone'] && (phone.dirty || phone.touched)">Invalid phone number</small>
      </div>
      <div class="field">
        <label for="country">Country <span class="text-red-500">*</span></label>
        <p-dropdown inputId="country" [options]="countries" optionLabel="name" formControlName="country" styleClass="w-full" [filter]="true" placeholder="Select your country" (onChange)="loadStates()"></p-dropdown>
      </div>
      <div class="field">
        <label for="state">State <span class="text-red-500">*</span></label>
        <p-dropdown inputId="state" [options]="states" optionLabel="name" formControlName="state" styleClass="w-full" [filter]="true" placeholder="Select your state" (onChange)="loadCities()"></p-dropdown>
      </div>
      <div class="field">
        <label for="city">City <span class="text-red-500">*</span></label>
        <p-dropdown inputId="city" [options]="cities" optionLabel="name" formControlName="city" styleClass="w-full" [filter]="true" placeholder="Select your city"></p-dropdown>
      </div>
      <p-button type="submit" label="Register" styleClass="w-full" [disabled]="registerForm.invalid"></p-button>
      <p-divider align="center" type="solid">OR</p-divider>
      <div>
        <app-oauth-button provider="Google" />
        <app-oauth-button provider="Microsoft" />
        <app-oauth-button provider="Twitter" />
      </div>
      <div class="mt-2">Already have an account? <a routerLink="/login" class="text-primary no-underline">Login</a></div>
    </p-card>
  </form>
</div>
