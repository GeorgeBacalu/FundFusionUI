<div class="flex justify-content-center align-items-center h-screen">
  <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()">
    <p-card header="Change Password" class="w-full sm:w-8 md:w-6 lg:w-4 xl:w-3">
      <div class="field">
        <label for="currentPassword">Old Password</label>
        <p-password inputId="currentPassword" formControlName="currentPassword" inputStyleClass="w-full" styleClass="w-full" placeholder="Enter your old password" [feedback]="false" [toggleMask]="true" />
        <small class="block text-red-500" *ngIf="currentPassword.invalid && (currentPassword.dirty || currentPassword.touched)">
          <div *ngIf="currentPassword.errors?.['required']">Current password is required</div>
        </small>
      </div>
      <div class="field">
        <label for="newPassword">New Password</label>
        <p-password inputId="newPassword" formControlName="newPassword" inputStyleClass="w-full" styleClass="w-full" placeholder="Enter your new password" [feedback]="false" [toggleMask]="true" />
        <small class="block text-red-500" *ngIf="newPassword.invalid && (newPassword.dirty || newPassword.touched)">
          <div *ngIf="newPassword.errors?.['required']">New password is required</div>
          <div *ngIf="newPassword.errors?.['pattern']">Invalid password</div>
        </small>
        <small class="block text-red-500" *ngIf="changePasswordForm.errors?.['passwordReused'] && newPassword.valid && currentPassword.valid">New password must differ from current</small>
      </div>
      <div class="field">
        <label for="confirmedPassword">Confirmed password</label>
        <p-password inputId="confirmedPassword" formControlName="confirmedPassword" inputStyleClass="w-full" styleClass="w-full" placeholder="Confirm your password" [feedback]="false" [toggleMask]="true" />
        <small class="block text-red-500" *ngIf="confirmedPassword.invalid && (confirmedPassword.dirty || confirmedPassword.touched)">
          <div *ngIf="confirmedPassword.errors?.['required']">Confirmed password is required</div>
        </small>
        <small class="block text-red-500" *ngIf="changePasswordForm.errors?.['passwordMismatch'] && confirmedPassword.valid && newPassword.valid">Passwords don't match</small>
      </div>
      <p-button type="submit" label="Change Password" styleClass="w-full" [disabled]="changePasswordForm.invalid"></p-button>
    </p-card>
  </form>
</div>
