<div class="flex justify-content-center align-items-center h-screen">
  <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()">
    <p-card header="Change Password" class="w-full">
      <div class="field">
        <label for="currentPassword">Old Password <span class="text-red-500">*</span></label>
        <p-password inputId="currentPassword" formControlName="currentPassword" inputStyleClass="w-full" styleClass="w-full" placeholder="Enter your old password" [feedback]="false" [toggleMask]="true" />
        <small *ngIf="currentPassword.errors?.['required'] && (currentPassword.dirty || currentPassword.touched)" class="block text-red-500">Current password is required</small>
      </div>
      <div class="field">
        <label for="newPassword">New Password <span class="text-red-500">*</span></label>
        <p-password inputId="newPassword" formControlName="newPassword" inputStyleClass="w-full" styleClass="w-full" placeholder="Enter your new password" [feedback]="false" [toggleMask]="true" />
        <small *ngIf="newPassword.errors?.['required'] && (newPassword.dirty || newPassword.touched)" class="block text-red-500">New password is required</small>
        <small *ngIf="newPassword.errors?.['pattern'] && (newPassword.dirty || newPassword.touched)" class="block text-red-500">Invalid password</small>
        <small *ngIf="changePasswordForm.errors?.['passwordReused'] && newPassword.valid && currentPassword.valid" class="block text-red-500">New password must differ from current</small>
      </div>
      <div class="field">
        <label for="confirmedPassword">Confirmed password <span class="text-red-500">*</span></label>
        <p-password inputId="confirmedPassword" formControlName="confirmedPassword" inputStyleClass="w-full" styleClass="w-full" placeholder="Confirm your password" [feedback]="false" [toggleMask]="true" />
        <small *ngIf="confirmedPassword.errors?.['required'] && (confirmedPassword.dirty || confirmedPassword.touched)" class="block text-red-500">Password confirmation is required</small>
        <small *ngIf="changePasswordForm.errors?.['passwordMismatch'] && confirmedPassword.valid && newPassword.valid" class="block text-red-500">Passwords don't match</small>
      </div>
      <p-button type="submit" label="Change Password" styleClass="w-full" [disabled]="changePasswordForm.invalid" />
    </p-card>
  </form>
</div>
