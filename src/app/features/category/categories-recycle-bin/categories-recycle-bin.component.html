<div class="flex flex-column h-screen">
  <app-navbar></app-navbar>
  <div class="flex-1 flex flex-column align-items-center p-4 gap-4">
    <p-tabs [(value)]="selectedIndex" (valueChange)="onTabChange($event)">
      <p-tablist>
        <p-tab value="0">Expense</p-tab>
        <p-tab value="1">Income</p-tab>
      </p-tablist>
    </p-tabs>
    <p-button label="Active Categories" icon="pi pi-arrow-left" severity="secondary" (click)="navigateToHome()" />
    <div class="grid w-full px-4" *ngIf="deletedCategories.length; else noDeletedCategories">
      <div class="col-12 md:col-6 lg:col-4" *ngFor="let parent of deletedCategories">
        <p-accordion [multiple]="true">
          <p-accordionTab>
            <ng-template pTemplate="header">
              <div class="flex justify-content-between w-full">
                <span class="flex align-items-center gap-2">
                  <img *ngIf="parent.imageUrl; else defaultIcon" [src]="parent.imageUrl" [alt]="parent.name" class="w-2rem h-2rem object-contain" />
                  <ng-template #defaultIcon><span class="pi pi-folder-open text-lg text-gray-500"></span></ng-template>
                  <span class="font-semibold">{{ parent.name }}</span>
                </span>
                <div class="flex gap-2">
                  <p-button icon="pi pi-undo" size="small" (click)="confirmRestore(parent.id)" />
                  <p-button icon="pi pi-trash" size="small" severity="danger" (click)="confirmDelete(parent.id)" />
                </div>
              </div>
            </ng-template>
            <p-accordion [multiple]="true" *ngIf="parent.subcategories.length; else noDeletedSubcategories">
              <p-accordionTab *ngFor="let child of parent.subcategories">
                <ng-template pTemplate="header">
                  <div class="flex justify-content-between w-full">
                    <span class="flex align-items-center gap-2">
                      <img *ngIf="child.imageUrl; else defaultIcon" [src]="child.imageUrl" [alt]="child.name" class="w-2rem h-2rem object-contain" />
                      <ng-template #defaultIcon><span class="pi pi-folder text-lg text-gray-500"></span></ng-template>
                      <span class="font-medium">{{ child.name }}</span>
                    </span>
                    <div class="flex gap-2">
                      <p-button icon="pi pi-undo" size="small" (click)="confirmRestore(child.id)" />
                      <p-button icon="pi pi-trash" size="small" severity="danger" (click)="confirmDelete(child.id)" />
                    </div>
                  </div>
                </ng-template>
              </p-accordionTab>
            </p-accordion>
            <ng-template #noDeletedSubcategories><div class="flex justify-content-center"><p class="text-xl text-gray-600 font-bold">No deleted subcategories</p></div></ng-template>
          </p-accordionTab>
        </p-accordion>
      </div>
    </div>
    <ng-template #noDeletedCategories><div class="flex justify-content-center"><p class="text-3xl text-gray-600 font-bold">No deleted categories</p></div></ng-template>
  </div>
</div>
