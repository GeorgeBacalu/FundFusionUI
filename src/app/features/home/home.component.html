<div class="flex flex-column h-screen">
  <app-navbar></app-navbar>
  <div class="flex-1 flex flex-column align-items-center p-4 gap-4">
    <p-tabs [(value)]="selectedIndex" (valueChange)="onTabChange($event)">
      <p-tablist>
        <p-tab value="0">Expense</p-tab>
        <p-tab value="1">Income</p-tab>
      </p-tablist>
    </p-tabs>
    <p-button label="Add Category" icon="pi pi-plus" (click)="this.isDialogShowing = true"></p-button>
    <p-dialog [(visible)]="isDialogShowing" [modal]="true" header="Add Category" (onHide)="resetForm()">
      <form [formGroup]="addCategoryForm" (ngSubmit)="addCategory()">
        <div class="field">
          <label for="name">Name <span class="text-red-500">*</span></label>
          <input type="text" id="name" pInputText formControlName="name" class="w-full" placeholder="Enter name" autocomplete="name" />
          <small class="block mt-2 text-red-500" *ngIf="name.invalid && (name.dirty || name.touched)">
            <div *ngIf="name.errors?.['required']">Name is required</div>
          </small>
        </div>
        <div class="field mt-3">
          <label for="financialType">Financial type <span class="text-red-500">*</span></label>
          <p-dropdown id="financialType" [options]="financialTypes" optionLabel="label" optionValue="value" formControlName="financialType" class="w-full" placeholder="Select financial type"></p-dropdown>
          <small class="block mt-2 text-red-500" *ngIf="financialType.invalid && (financialType.dirty || financialType.touched)">
            <div *ngIf="financialType.errors?.['required']">Financial type is required</div>
          </small>
        </div>
        <div class="field mt-3">
          <label for="imageUpload">Image</label>
          <input type="file" id="imageUpload" #fileInput (change)="onImageSelected($event)" accept="image/*" class="w-full" />
        </div>
        <div class="flex justify-content-end gap-2">
          <p-button label="Cancel" icon="pi pi-times" severity="secondary" (onClick)="confirmCancel()"></p-button>
          <p-button type="submit" label="Save" icon="pi pi-save" [disabled]="addCategoryForm.invalid"></p-button>
        </div>
      </form>
    </p-dialog>
    <p-accordion *ngIf="categories.length; else emptyState" [multiple]="true" class="w-6 mx-auto">
      <p-accordionTab *ngFor="let parent of categories" [disabled]="!parent.subcategories.length">
        <ng-template pTemplate="header" class="flex align-items-center gap-3">
          <img *ngIf="parent.imageUrl; else parentDefaultIcon" [src]="parent.imageUrl" [alt]="parent.name" class="w-2rem h-2rem object-fit-contain" />
          <ng-template #parentDefaultIcon><span class="pi pi-folder-open text-lg text-gray-500"></span></ng-template>
          <span class="font-semibold text-base">{{ parent.name }}</span>
        </ng-template>
        <p-accordion [multiple]="true">
          <p-accordionTab *ngFor="let child of parent.subcategories" [disabled]="!child.subcategories.length">
            <ng-template pTemplate="header" class="flex align-items-center gap-3">
              <img *ngIf="child.imageUrl; else childDefaultIcon" [src]="child.imageUrl" [alt]="child.name" class="w-2rem h-2rem object-fit-contain" />
              <ng-template #childDefaultIcon><span class="pi pi-folder text-lg text-gray-500"></span></ng-template>
              <span class="font-medium">{{ child.name }}</span>
            </ng-template>
          </p-accordionTab>
        </p-accordion>
      </p-accordionTab>
    </p-accordion>
    <ng-template #emptyState><div class="flex justify-content-center align-items-center h-full"><p class="text-3xl text-gray-600 font-bold">No categories available</p></div></ng-template>
  </div>
</div>
