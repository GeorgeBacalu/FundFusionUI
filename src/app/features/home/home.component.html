<div class="flex flex-column h-screen">
  <app-navbar></app-navbar>
  <div class="flex-1 flex flex-column align-items-center p-4 gap-4">
    <p-tabs [(value)]="selectedIndex" (valueChange)="onTabChange($event)">
      <p-tablist>
        <p-tab value="0">Expense</p-tab>
        <p-tab value="1">Income</p-tab>
      </p-tablist>
    </p-tabs>
    <p-button label="Add Category" icon="pi pi-plus" (click)="openDialog(true, false)" />
    <div class="grid w-full px-4" *ngIf="categories.length; else noCategories">
      <div class="col-12 md:col-6 lg:col-4" *ngFor="let parent of categories">
        <p-accordion [multiple]="true">
          <p-accordionTab>
            <ng-template pTemplate="header">
              <div class="flex justify-content-between w-full">
                <span class="flex align-items-center gap-2">
                  <img *ngIf="parent.imageUrl; else defaultIcon" [src]="parent.imageUrl" [alt]="parent.name" class="w-2rem h-2rem object-contain" />
                  <ng-template #defaultIcon><span class="pi pi-folder-open text-lg text-gray-500"></span></ng-template>
                  <span class="font-semibold">{{ parent.name }}</span>
                </span>
                <p-button icon="pi pi-pencil" size="small" [disabled]="parent.isDefault" (click)="openDialog(true, true, parent)" />
              </div>
            </ng-template>
            <div class="flex justify-content-center mb-3"><p-button label="Add Subcategory" icon="pi pi-plus" size="small" (click)="openDialog(false, false, parent)" /></div>
            <p-accordion [multiple]="true" *ngIf="parent.subcategories.length; else noSubcategories">
              <p-accordionTab *ngFor="let child of parent.subcategories">
                <ng-template pTemplate="header">
                  <div class="flex justify-content-between w-full">
                    <span class="flex align-items-center gap-2">
                      <img *ngIf="child.imageUrl; else defaultIcon" [src]="child.imageUrl" [alt]="child.name" class="w-2rem h-2rem object-contain" />
                      <ng-template #defaultIcon><span class="pi pi-folder text-lg text-gray-500"></span></ng-template>
                      <span class="font-medium">{{ child.name }}</span>
                    </span>
                    <p-button icon="pi pi-pencil" size="small" [disabled]="child.isDefault" (click)="openDialog(false, true, child)" />
                  </div>
                </ng-template>
              </p-accordionTab>
            </p-accordion>
            <ng-template #noSubcategories><div class="flex justify-content-center"><p class="text-xl text-gray-600 font-bold">No subcategories available</p></div></ng-template>
          </p-accordionTab>
        </p-accordion>
      </div>
    </div>
    <ng-template #noCategories><div class="flex justify-content-center"><p class="text-3xl text-gray-600 font-bold">No categories available</p></div></ng-template>
  </div>
</div>
<p-dialog [(visible)]="isDialogShowing" [modal]="true" [header]="(isEditMode ? 'Edit' : 'Add') + (isParentMode ? ' Category' : ' Subcategory')" [styleClass]="'w-30rem h-auto'" (onHide)="resetForm()">
  <form [formGroup]="categoryForm" (ngSubmit)="saveCategory()" class="flex flex-column justify-content-between h-full">
    <div>
      <div class="field">
        <label for="name">Name <span class="text-red-500">*</span></label>
        <input type="text" id="name" pInputText formControlName="name" class="w-full" placeholder="Enter name" autocomplete="name" />
        <small class="block mt-2 text-red-500" *ngIf="name.invalid && (name.dirty || name.touched)">
          <div *ngIf="name.errors?.['required']">Name is required</div>
        </small>
      </div>
      <div class="field mt-3" *ngIf="isParentMode">
        <label for="financialType">Financial type <span class="text-red-500">*</span></label>
        <p-dropdown id="financialType" [options]="financialTypes" optionLabel="label" optionValue="value" formControlName="financialType" class="w-full" placeholder="Select financial type"></p-dropdown>
        <small class="block mt-2 text-red-500" *ngIf="financialType.invalid && (financialType.dirty || financialType.touched)">
          <div *ngIf="financialType.errors?.['required']">Financial type is required</div>
        </small>
      </div>
      <div class="field mt-3" *ngIf="!isParentMode">
        <label for="parentCategory">Parent Category <span class="text-red-500">*</span></label>
        <p-dropdown inputId="parentCategory" [options]="categories" optionLabel="name" formControlName="parentCategory" [filter]="true" class="w-full" placeholder="Select parent category">
          <ng-template let-category pTemplate="item">
            <div class="flex align-items-center gap-2">
              <img *ngIf="category.imageUrl; else defaultIcon" [src]="category.imageUrl" [alt]="category.name" class="w-2rem h-2rem object-contain" />
              <ng-template #defaultIcon><span class="pi pi-folder text-lg text-gray-500"></span></ng-template>
              <span class="font-semibold text-base">{{ category.name }}</span>
            </div>
          </ng-template>
        </p-dropdown>
        <small class="block mt-2 text-red-500" *ngIf="parentCategory.invalid && (parentCategory.dirty || parentCategory.touched)">
          <div *ngIf="parentCategory.errors?.['required']">Parent category is required</div>
        </small>
      </div>
      <div class="field mt-3">
        <label for="image">Image</label>
        <div class="flex align-items-center gap-3">
          <p-button label="Choose Image" icon="pi pi-upload" (click)="this.fileInput.nativeElement.click()" />
          <span class="text-sm text-gray-500">{{ image.value?.name ?? imagePreviewUrl?.split('/')?.pop() }}</span>
        </div>
        <input type="file" id="image" #fileInput (change)="onImageSelected($event)" accept="image/*" hidden />
      </div>
      <div *ngIf="imagePreviewUrl" class="mt-2 flex align-items-center gap-2">
        <img [src]="imagePreviewUrl" alt="Preview" class="w-4rem h-4rem object-cover border-round" />
        <p-button label="Remove" icon="pi pi-times" severity="danger" size="small" (click)="removeImage()" />
      </div>
    </div>
    <div class="flex justify-content-end gap-2">
      <p-button label="Cancel" icon="pi pi-times" severity="secondary" (onClick)="confirmCancel()" />
      <p-button type="submit" [label]="isEditMode ? 'Edit' : 'Save'" icon="pi pi-save" [disabled]="categoryForm.invalid" />
    </div>
  </form>
</p-dialog>
